services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/ctf-challenge-platform
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=http://localhost:5173
      - FLAG_SALT=${FLAG_SALT}
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api

  # Bundled containerised web challenges — one shared instance per
  # challenge. Flags come from the compose .env, never from the image.
  web-hidden-flag:
    build: ./docker/web-hidden-flag
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      - PORT=3000
      - FLAG=${WEB_HIDDEN_FLAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  web-source-leak:
    build: ./docker/web-source-leak
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - PORT=3000
      - FLAG=${WEB_SOURCE_LEAK_FLAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mongo-data:
